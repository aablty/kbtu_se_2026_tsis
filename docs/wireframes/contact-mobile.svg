<svg viewBox="0 0 375 900" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Contact page - mobile wireframe</title>
<desc>Mobile header; stacked info card (email, Telegram) then stacked contact form card with name, callback-method selector (WhatsApp/Telegram/Email) + matching value field, message, submit; note on server-side WAHA send.</desc>
<rect x="0" y="0" width="375" height="900" fill="#FFFFFF" stroke="#333333"/>
<rect x="0" y="0" width="375" height="56" fill="#FFFFFF" stroke="#333333"/>
<text x="16" y="34" font-size="16" fill="#333333">N.N.</text>
<rect x="320" y="16" width="36" height="24" fill="none" stroke="#333333" stroke-dasharray="4 3"/>
<text x="24" y="100" font-size="20" fill="#333333">Contact</text>
<rect x="24" y="130" width="327" height="140" fill="#FFFFFF" stroke="#333333"/>
<text x="40" y="160" font-size="12" fill="#333333">Direct channels</text>
<text x="40" y="195" font-size="10" fill="#777777">icon: mail</text>
<text x="85" y="195" font-size="11" fill="#333333">contact@aablty.one</text>
<text x="40" y="225" font-size="10" fill="#777777">icon: send</text>
<text x="85" y="225" font-size="11" fill="#333333">@aablty (Telegram)</text>
<rect x="24" y="300" width="327" height="460" fill="#FFFFFF" stroke="#333333"/>
<text x="40" y="330" font-size="12" fill="#333333">Contact form</text>
<text x="40" y="355" font-size="10" fill="#777777">Name</text>
<rect x="40" y="362" width="295" height="34" fill="none" stroke="#333333"/>
<text x="40" y="420" font-size="10" fill="#777777">Call me back via (selector)</text>
<rect x="40" y="427" width="295" height="34" fill="none" stroke="#333333"/>
<text x="50" y="449" font-size="9" fill="#333333">WhatsApp / Telegram / Email ▾</text>
<text x="40" y="485" font-size="10" fill="#777777">Callback value (matches method above)</text>
<rect x="40" y="492" width="295" height="34" fill="none" stroke="#333333"/>
<text x="40" y="550" font-size="10" fill="#777777">Message</text>
<rect x="40" y="557" width="295" height="85" fill="none" stroke="#333333"/>
<rect x="40" y="660" width="295" height="42" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="165" y="686" font-size="13" fill="#333333">Send</text>
<text x="40" y="718" font-size="9" fill="#999999">sent server-side via WAHA WhatsApp;</text>
<text x="40" y="730" font-size="9" fill="#999999">callback method/value only seen by author</text>
<rect x="0" y="820" width="375" height="60" fill="#FFFFFF" stroke="#333333"/>
<text x="16" y="855" font-size="10" fill="#777777">footer</text>
</svg>
