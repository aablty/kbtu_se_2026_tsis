<svg viewBox="0 0 1280 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Contact page - desktop wireframe</title>
<desc>Nav header; section title; left card with email and Telegram; right card with contact form (name, phone, message) noting server-side WAHA WhatsApp send.</desc>
<rect x="0" y="0" width="1280" height="680" fill="#FFFFFF" stroke="#333333"/>
<rect x="0" y="0" width="1280" height="64" fill="#FFFFFF" stroke="#333333"/>
<text x="24" y="38" font-size="18" fill="#333333">N.N.</text>
<text x="420" y="38" font-size="14" fill="#333333">Home  About  Interests  Future  [Contact]</text>
<text x="1140" y="38" font-size="12" fill="#777777">lang | theme</text>
<text x="80" y="130" font-size="26" fill="#333333">Contact</text>
<rect x="80" y="170" width="380" height="300" fill="#FFFFFF" stroke="#333333"/>
<text x="100" y="205" font-size="13" fill="#333333">Direct channels</text>
<text x="100" y="245" font-size="11" fill="#777777">icon: mail</text>
<text x="150" y="245" font-size="12" fill="#333333">contact@aablty.one</text>
<text x="100" y="285" font-size="11" fill="#777777">icon: send</text>
<text x="150" y="285" font-size="12" fill="#333333">@aablty (Telegram)</text>
<rect x="500" y="170" width="700" height="440" fill="#FFFFFF" stroke="#333333"/>
<text x="520" y="205" font-size="13" fill="#333333">Contact form</text>
<text x="520" y="230" font-size="11" fill="#777777">Name</text>
<rect x="520" y="238" width="660" height="36" fill="none" stroke="#333333"/>
<text x="520" y="300" font-size="11" fill="#777777">Phone</text>
<rect x="520" y="308" width="660" height="36" fill="none" stroke="#333333"/>
<text x="520" y="370" font-size="11" fill="#777777">Message</text>
<rect x="520" y="378" width="660" height="110" fill="none" stroke="#333333"/>
<rect x="520" y="510" width="150" height="40" fill="#FFFFFF" stroke="#333333" stroke-width="1.5"/>
<text x="545" y="535" font-size="13" fill="#333333">Send</text>
<text x="520" y="575" font-size="10" fill="#999999">submits server-side to author's WAHA WhatsApp integration (no email/phone exposed client-side)</text>
<rect x="0" y="630" width="1280" height="50" fill="#FFFFFF" stroke="#333333"/>
<text x="24" y="660" font-size="11" fill="#777777">footer</text>
