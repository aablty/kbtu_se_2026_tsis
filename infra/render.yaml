services:
  - type: web
    name: nursultan-nurgali
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: WAHA_API_URL
        sync: false
      - key: WAHA_API_KEY
        sync: false
      - key: WAHA_SESSION_NAME
        sync: false
      - key: SITE_URL
        value: https://nursultan-nurgali.onrender.com
