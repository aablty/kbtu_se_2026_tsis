services:
  - type: web
    name: nursultan-nurgali
    runtime: node
    region: frankfurt
    plan: free
    branch: main
    autoDeployTrigger: "checksPass"
    buildCommand: bun install && bun run build
    startCommand: bun run start
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: SITE_URL
        value: https://nursultan-nurgali.onrender.com
